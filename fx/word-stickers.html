<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbe fx, stickers</title>
<meta name="robots" content="noindex">
<meta name="description" content="The wrong yardsticks as die cut stickers with hard ink shadows, as used on r6-a.">
<link rel="icon" href="../assets/r5/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/brand/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--orbe-paper); color: var(--orbe-ink); overflow-x: hidden; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  main { max-width: 1280px; margin: 0 auto; padding: 48px 16px 64px; }
  .k { font: 500 12px/1 var(--mono); color: var(--orbe-graphite); margin: 0 0 16px; }
  .k a { color: inherit; text-underline-offset: 3px; }
  .card { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: var(--r-tab); background: var(--orbe-sky); border: 0; overflow: hidden; }
  .line { font: 400 var(--t-lede)/1.3 var(--serif); margin: 20px 0 0; max-width: 40ch; }
  @media (max-width: 640px) { .card { aspect-ratio: 4 / 5; } main { padding-top: 32px; } }
</style>
</head>
<body>
<main>
  <p class="k"><a href="./">Motion lab</a> / Stickers, in use on r6-a</p>
  <div class="card" id="card" aria-hidden="true"></div>
  <p class="line">The wrong yardsticks. Go on, fling one; your size is the one that counts.</p>
</main>
<script type="module">
  import { mount } from "../assets/fx/word-stickers.js";
  import { COLOURS as C } from "../assets/brand/brand.js";
  const SANS = '"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif';
  const SERIF = '"Newsreader", Georgia, serif';
  const MONO = '"Commit Mono", ui-monospace, Menlo, monospace';
  /* r6-a's set, in the blue scheme: five wrong yardsticks and the fair one. */
  const wide = innerWidth >= 640;
  const at = wide
    ? { "the top 1%": [0.24, 0.2], viral: [0.8, 0.2], "your size": [0.42, 0.52], followers: [0.82, 0.55], "the charts": [0.2, 0.82], "vanity views": [0.66, 0.84] }
    : { "the top 1%": [0.32, 0.14], viral: [0.78, 0.3], "your size": [0.46, 0.5], followers: [0.3, 0.7], "the charts": [0.7, 0.86], "vanity views": [0.4, 0.95] };
  const stickers = [
    { word: "the top 1%", font: SANS, weight: 800, style: "normal", base: C.chalk, fill: C.cobalt, rot: -7 },
    { word: "viral", font: MONO, weight: 600, style: "normal", base: C.ember, fill: C.ink, rot: 6 },
    { word: "your size", font: SERIF, weight: 700, style: "normal", base: C.cobalt, fill: C.chalk, rot: -2 },
    { word: "the charts", font: SERIF, weight: 500, style: "italic", base: C.straw, fill: C.ink, rot: 5 },
    { word: "followers", font: SANS, weight: 500, style: "italic", base: C.peony, fill: C.ink, rot: -4 },
    { word: "vanity views", font: SANS, weight: 800, style: "normal", base: C.ink, fill: C.sky, rot: 3 },
  ].map((d) => ({ ...d, x: at[d.word][0], y: at[d.word][1] }));
  window.__fx = mount(document.getElementById("card"), { stickers, shadow: "hard" });
</script>
</body>
</html>
