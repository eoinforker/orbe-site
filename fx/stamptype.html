<!doctype html>
<html lang="en-GB" data-scheme="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbe fx, stamp type</title>
<meta name="robots" content="noindex">
<meta name="description" content="A kinetic type poster loop in the brand colours.">
<link rel="icon" href="../assets/r5/favicon.svg" type="image/svg+xml">
<script>
  (function () { var s = null; try { s = new URLSearchParams(location.search).get("scheme"); } catch (e) {} if (s === "pink") document.documentElement.setAttribute("data-scheme", "pink"); })();
</script>
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/brand/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { margin: 0; background: var(--orbe-paper, #F3F0E8); color: var(--orbe-ink, #141311); font: 400 16px/1.5 var(--sans, system-ui, sans-serif); -webkit-font-smoothing: antialiased; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  .k { font: 500 12px/1 var(--mono, ui-monospace, monospace); color: var(--orbe-graphite, #5D584F); margin: 0 0 14px; }
  .card { width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; border: 1px solid rgba(20, 19, 17, 0.14); overflow: hidden; user-select: none; }
  @media (min-width: 640px) { .card { aspect-ratio: 1344 / 620; } }
  .line { margin: 14px 0 0; font: 500 clamp(17px, 2.2vw, 22px)/1.3 var(--sans); letter-spacing: -0.01em; max-width: 46ch; }
  .k a, .label a { color: inherit; text-underline-offset: 3px; }
  .foot { margin-top: 40px; padding-top: 14px; border-top: 1px solid rgba(20, 19, 17, 0.16); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 14px; }
  .foot a { font-weight: 600; text-underline-offset: 3px; }
  .sw { display: flex; gap: 4px; margin-left: auto; align-items: center; }
  .sw span { font: 500 12px/1 var(--mono, ui-monospace, monospace); color: var(--orbe-graphite, #5D584F); margin-right: 6px; }
  .sw button { font: 600 14px/1 var(--sans, system-ui, sans-serif); color: inherit; background: none; border: 0; padding: 10px 8px; min-height: 40px; cursor: pointer; text-underline-offset: 4px; }
  .sw button[aria-pressed="true"] { text-decoration: underline; text-decoration-thickness: 2px; }
</style>
</head>
<body>
<main>
  <p class="k"><a href="./">Motion lab</a> / Stamp type, a candidate for social posts</p>
  <div class="card" id="fx"></div>
  <p class="line">Rated against creators your size, read from payouts, and free until money moves.</p>
  <footer class="foot"><a href="./">Motion lab</a><a href="../brand/">Brand book</a>
    <div class="sw" role="group" aria-label="Brand colour"><span>Brand colour</span><button type="button" data-scheme-set="blue" aria-pressed="true">Blue</button><button type="button" data-scheme-set="pink" aria-pressed="false">Pink</button></div>
  </footer>
</main>
<script type="module">
  import { mount } from "../assets/fx/stamptype.js";
  const el = document.getElementById("fx");
  let fx = null;
  const set = (s, push) => {
    document.documentElement.setAttribute("data-scheme", s);
    for (const b of document.querySelectorAll("[data-scheme-set]")) b.setAttribute("aria-pressed", String(b.dataset.schemeSet === s));
    if (push) { try { const u = new URL(location.href); u.searchParams.set("scheme", s); history.replaceState(null, "", u); } catch (e) {} }
    if (fx) fx.destroy();
    fx = mount(el, { scheme: s });
  };
  for (const b of document.querySelectorAll("[data-scheme-set]")) b.addEventListener("click", () => set(b.dataset.schemeSet, true));
  set(document.documentElement.getAttribute("data-scheme") === "pink" ? "pink" : "blue", false);
</script>
</body>
</html>
