        - listitem: Against Over 5M Looks like genius. Not a fair comparison. 99 in 100
        - listitem: Its size, 250k to 1M Ahead of most. 93 in 100
      - paragraph: Against small channels, ordinary. Against the giants, a genius. Neither is fair.
    - figure "Orbe Rating, @fieldrecordings":
      - text: Orbe Rating, @fieldrecordings
      - paragraph: "The Orbe Rating: +1.23 Good"
