        - listitem: Subpar
        - listitem: Average
        - listitem: Good
        - listitem: Great
      - list:
        - listitem: 93 Reach 37% of subscribers
        - listitem: 60 Momentum +12%
        - listitem: 78 Engagement 5.6%
      - paragraph: "The weights for channels: Reach 30%, Momentum 25%, Hit rate 20%, Engagement 15%, Cadence 10%. Independently calculated by Orbe. It is not a YouTube metric, and it is not provided or endorsed by YouTube or Google."
