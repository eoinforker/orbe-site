  - region "The Orbe Times":
    - paragraph: Made-up edition No. 1 Free, for good
    - heading "The Orbe Times" [level=2]
    - paragraph: The State of the Middle. News about creators your size, none of them real. Every figure is computed live by the Orbe engine.
    - article:
      - paragraph: Made up Lead story
      - heading "The middle reaches 10%. Field Recordings reaches 37%." [level=3]
      - paragraph: How many of your subscribers a typical upload reaches. For channels at 250k to 1M subscribers, the typical is 10%. Field Recordings sits at 37%, which beats 93 in 100 channels its size.
      - figure "Typical reach for channels, by size":
        - text: Typical reach for channels, by size
        - list:
          - listitem: Under 10k 30%
          - listitem: 10k to 100k 20%
          - listitem: 100k to 250k 15%
          - listitem: 250k to 1M 10%
          - listitem: 1M to 5M 7%
          - listitem: Over 5M 4%
          - listitem: Field Recordings 37%
    - article:
      - 'figure "Paid conversion: 66 in 100"'
      - paragraph: Made up Newsletter, 10k to 50k subscribers
      - heading "Margin Notes moves up a size." [level=3]
      - paragraph: From 1k to 10k to 10k to 50k subscribers. Against its new rivals, it beats 86 in 100 on reach.
    - article:
      - 'figure "Reach: 94 in 100"'
      - paragraph: Made up Stream, 10k to 100k followers
      - heading "Night Shift breaks its own record." [level=3]
      - paragraph: "Its highest peak viewers: 5,496, up from 2,879. Rated +1.81, Good."
    - article:
      - 'figure "Reach: 63 in 100"'
      - paragraph: Made up Podcast, 5k to 25k followers
      - heading "One episode of The Long Table did 3.7× a typical one." [level=3]
      - paragraph: The show is rated +0.71, Average. A typical episode of The Long Table is downloaded 7,077 times in its first week, 51% of its followers.
    - article:
      - 'figure "Reach: 73 in 100"'
      - paragraph: Made up Photography, 50k to 250k followers
      - 'heading "Low Tide Prints lands in the middle: +0.38, Average." [level=3]'
      - paragraph: A typical photo set from Low Tide Prints gets 10,390 views, equal to 17% of its followers. Zero is typical, and the middle is where most good work lives.
    - paragraph: Every story in The Orbe Times is made up, about made-up creators rated live by the Orbe engine. The engine's starting baselines. The first season replaces them with consented data. Independently calculated by Orbe.
  - region "Then, when money moves.":
    - paragraph: After the rating
    - heading "Then, when money moves." [level=2]
    - figure "01 Your record":
      - text: 01 Your record
      - heading "Read from payouts, not estimates." [level=3]
      - paragraph: Every verified figure shows its source and the day we read it. Where a platform does not report payouts, we say so.
    - figure "02 Sponsorships":
      - text: 02 Sponsorships
      - heading "Sponsors, at a fair rate." [level=3]
      - paragraph: 15% when Orbe finds the brand, 5% when you bring your own.
      - paragraph: Paid by the brand, never by you, only when the sponsorship completes.
    - figure "03 Selling":
      - text: 03 Selling
      - heading "A fair sale, when you want one." [level=3]
      - paragraph: 8% up to £500k, 5% from £500k to £2M, 3% above, £4,000 minimum.
      - paragraph: From the proceeds, only if it sells. Nothing if it doesn't.
    - paragraph: For buyers and lenders
    - heading "Buying or lending?" [level=2]
    - paragraph: Creator businesses, rated against their size and read from payouts. Every creator who connects adds consented figures to the benchmark, so it sharpens with each one, and an estimate built from views cannot copy it.
    - term: Buy
    - definition: Free, vetted access. A 2% buyer's premium at completion, 1% above £2M, £1,000 minimum. Diligence reports included; £1,500 only if you walk away after one, never if it shows the listing was wrong.
    - term: Lend
    - definition: A fixed fee per file, paid by the lender.
    - link "Request buyer access":
      - /url: mailto:hello@orbe.vc?subject=Buyer%20access
    - figure "Made-up examples, by size Rating":
      - text: Made-up examples, by size Rating
      - list:
        - listitem: 250k to 1Msubscribers Field RecordingsChannel +1.23 Good
        - listitem: 10k to 50ksubscribers Margin NotesNewsletter +1.12 Good
        - listitem: 10k to 100kfollowers Night ShiftStream +1.81 Good
        - listitem: 5k to 25kfollowers The Long TablePodcast +0.71 Average
        - listitem: 50k to 250kfollowers Low Tide PrintsPhotography +0.38 Average
      - paragraph: Each moon is lit by its reach score. Rated live by the Orbe engine. Independently calculated by Orbe.
