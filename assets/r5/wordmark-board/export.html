<!doctype html><meta charset="utf-8"><svg id=s width=10 height=10></svg>
<script type=module>
import { build } from "./final.mjs";
const f = (n) => (Math.round(n * 10) / 10).toString(), pt = (p) => `${f(p[0])} ${f(p[1])}`;
function ospine(g) {
  const a0 = g.th, rx = g.rx - g.Sr / 2, ry = g.ry - g.H / 2, N = 40, P = [];
  for (let i = 0; i <= N + 2; i++) { const a = a0 - (2 * Math.PI * i) / N; P.push([g.Ocx + rx * Math.cos(a), g.Ocy + ry * Math.sin(a)]); }
  let d = `M${pt(P[0])}`;
  for (let i = 0; i < N; i++) { const p0 = P[(i - 1 + N) % N], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2];
    d += `C${pt([p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6])} ${pt([p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6])} ${pt(p2)}`; }
  return d;
}
function bbox(d) { s.innerHTML = `<path d="${d}"/>`; const b = s.firstChild.getBBox(); return [b.x, b.y, b.width, b.height]; }
const g = build();
const fav = build({ Sr: 124, H: 52, hw: 30, swell: 22, ball: 48, scale: 0.56, n: 80 });
window.EXPORT = {
  main: { O: g.O, loop: g.loop, ball: g.ball, rbe: g.rbe, spine: g.spine, ospine: ospine(g), end: g.end, ballR: g.ballR, bbox: bbox(g.O + g.loop + g.ball + g.rbe), B: g.B },
  fav: { d: fav.O + fav.loop + fav.ball, bbox: bbox(fav.O + fav.loop + fav.ball) },
};
</script>
